<style>
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(-10px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes scaleIn {
    from {
      opacity: 0;
      transform: scale(0.95);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .nav-item {
    position: relative;
  }

  .nav-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 0;
    background: #0f172a;
    border-radius: 0 1px 1px 0;
    transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-item.active::before {
    height: 50%;
  }

  .nav-item-enter {
    animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .dropdown-enter {
    animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .sidebar-backdrop {
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }

  /* Smooth icon transitions */
  .nav-icon {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-item:hover .nav-icon {
    transform: translateX(2px);
  }

  /* Logo container hover effect */
  .logo-container {
    position: relative;
  }

  .logo-content {
    transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .toggle-reveal {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .logo-container.minimized:hover .logo-content {
    opacity: 0;
    transform: scale(0.9);
  }

  .logo-container.minimized:hover .toggle-reveal {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* Scrollbar styling */
  .sidebar-scroll::-webkit-scrollbar {
    width: 4px;
  }

  .sidebar-scroll::-webkit-scrollbar-track {
    background: transparent;
  }

  .sidebar-scroll::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.3);
    border-radius: 2px;
  }

  .sidebar-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.5);
  }
</style>

<aside
  class="fixed left-0 top-0 h-full z-40
         sidebar-backdrop bg-white
         border-r border-slate-200
         flex flex-col
         transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
  [class.w-64]="!isMinimized"
  [class.w-20]="isMinimized">

  <!-- ================= HEADER ================= -->
  <div
    class="flex items-center h-16 border-b border-slate-200
           transition-all duration-300"
    [class.justify-center]="isMinimized"
    [class.px-4]="!isMinimized"
    [class.px-3]="isMinimized">

    <!-- LOGO CONTAINER -->
    <div 
      class="logo-container flex items-center transition-all duration-300"
      [class.minimized]="isMinimized"
      [class.w-full]="isMinimized"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized">
      
      <!-- NORMAL LOGO CONTENT -->
      <div class="logo-content flex items-center"
           [class.gap-3]="!isMinimized">
        
        <!-- LOGO ICON -->
        <div
          class="relative w-9 h-9 
                 bg-slate-900
                 rounded-lg
                 flex items-center justify-center 
                 transition-all duration-300 hover:scale-105
                 flex-shrink-0 cursor-pointer">
          <svg 
            class="w-5 h-5 text-white"
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
        </div>

        <div
          *ngIf="!isMinimized"
          class="flex flex-col">
          <span class="font-bold text-base text-slate-900 leading-tight">
            Outspace
          </span>
          <span class="text-[11px] text-slate-500 font-medium tracking-wide">
            ADMIN PANEL
          </span>
        </div>
      </div>

      <!-- TOGGLE BUTTON REVEAL (MINIMIZED STATE) -->
      <div 
        *ngIf="isMinimized"
        class="toggle-reveal flex items-center justify-center w-full">
        <button
          (click)="toggleSidebar()"
          class="p-2 rounded-lg 
                 bg-slate-900 hover:bg-slate-800
                 transition-all duration-200
                 hover:scale-105 active:scale-95 cursor-pointer">
          <svg
            class="w-4 h-4 text-white"
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24"
            stroke-width="2">
            <path 
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- TOGGLE BUTTON (EXPANDED STATE) -->
    <button
      *ngIf="!isMinimized"
      (click)="toggleSidebar()"
      class="ml-auto p-2 rounded-lg 
             bg-slate-100 hover:bg-slate-200
             transition-all duration-200
             hover:scale-105 active:scale-95 cursor-pointer">
      <svg
        class="w-4 h-4 text-slate-600"
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24"
        stroke-width="2">
        <path 
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
  </div>

  <!-- ================= NAVIGATION ================= -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-6 space-y-6 sidebar-scroll">

    <!-- OVERVIEW SECTION -->
    <div>
      <div 
        *ngIf="!isMinimized"
        class="px-3 mb-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
        Overview
      </div>

      <div class="space-y-1">
        <!-- DASHBOARD -->
        <a
          routerLink="/dashboard"
          title="Dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item nav-item-enter group
                 flex items-center px-3 py-2.5 rounded-lg
                 font-medium text-sm text-slate-600
                 hover:bg-slate-100 hover:text-slate-900
                 transition-all duration-200"
          [class.justify-center]="isMinimized"
          [class.gap-3]="!isMinimized"
          [ngClass]="{'bg-slate-900 text-white': isActiveRoute('/dashboard')}">

          <svg class="nav-icon w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>

          <span 
            class="transition-all duration-300 whitespace-nowrap"
            [class.opacity-0]="isMinimized"
            [class.w-0]="isMinimized"
            [class.overflow-hidden]="isMinimized">
            Dashboard
          </span>
        </a>

        <!-- CONVERSATIONS -->
        <a
          routerLink="/admin/conversations"
          title="Conversations"
          routerLinkActive="active"
          class="nav-item nav-item-enter group
                 relative flex items-center px-3 py-2.5 rounded-lg
                 font-medium text-sm text-slate-600
                 hover:bg-slate-100 hover:text-slate-900
                 transition-all duration-200"
          [class.justify-center]="isMinimized"
          [class.gap-3]="!isMinimized"
          [ngClass]="{'bg-slate-900 text-white': isActiveRoute('/admin/conversations')}">

          <svg class="nav-icon w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>

          <span 
            class="transition-all duration-300 whitespace-nowrap"
            [class.opacity-0]="isMinimized"
            [class.w-0]="isMinimized"
            [class.overflow-hidden]="isMinimized">
            Conversations
          </span>

          <!-- UNREAD BADGE -->
          <span
            *ngIf="unreadCount > 0"
            class="absolute top-1.5 
                   min-w-[18px] h-[18px] px-1
                   rounded-full 
                   bg-slate-900 text-white
                   text-[10px] font-bold
                   flex items-center justify-center
                   transition-all duration-300"
            [class.right-1.5]="!isMinimized"
            [class.right-1]="isMinimized">
            {{ unreadCount > 99 ? '99+' : unreadCount }}
          </span>
        </a>
      </div>
    </div>

    <!-- PRODUCTS SECTION -->
    <div>
      <div 
        *ngIf="!isMinimized"
        class="px-3 mb-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
        Products
      </div>

      <div class="space-y-1">
        <!-- VIDEO GAMES -->
        <a
          routerLink="/videogames"
          title="Video Games"
          routerLinkActive="active"
          class="nav-item nav-item-enter group
                 flex items-center px-3 py-2.5 rounded-lg
                 font-medium text-sm text-slate-600
                 hover:bg-slate-100 hover:text-slate-900
                 transition-all duration-200"
          [class.justify-center]="isMinimized"
          [class.gap-3]="!isMinimized"
          [ngClass]="{'bg-slate-900 text-white': isActiveRoute('/videogames')}">

          <svg class="nav-icon w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
          </svg>

          <span 
            class="transition-all duration-300 whitespace-nowrap"
            [class.opacity-0]="isMinimized"
            [class.w-0]="isMinimized"
            [class.overflow-hidden]="isMinimized">
            Video Games
          </span>
        </a>

        <!-- DIGITAL PRODUCTS -->
        <a
          routerLink="/admin/digital-products"
          title="Digital Products"
          routerLinkActive="active"
          class="nav-item nav-item-enter group
                 flex items-center px-3 py-2.5 rounded-lg
                 font-medium text-sm text-slate-600
                 hover:bg-slate-100 hover:text-slate-900
                 transition-all duration-200"
          [class.justify-center]="isMinimized"
          [class.gap-3]="!isMinimized"
          [ngClass]="{'bg-slate-900 text-white': isActiveRoute('/admin/digital-products')}">

          <svg class="nav-icon w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
          </svg>

          <span 
            class="transition-all duration-300 whitespace-nowrap"
            [class.opacity-0]="isMinimized"
            [class.w-0]="isMinimized"
            [class.overflow-hidden]="isMinimized">
            Digital Products
          </span>
        </a>
      </div>
    </div>

    <!-- ORDERS SECTION -->
    <div>
      <div 
        *ngIf="!isMinimized"
        class="px-3 mb-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
        Orders
      </div>

      <div class="space-y-1">
        <!-- VIDEO GAME ORDERS -->
        <a
          routerLink="/admin/orders"
          title="Game Orders"
          routerLinkActive="active"
          class="nav-item nav-item-enter group
                 flex items-center px-3 py-2.5 rounded-lg
                 font-medium text-sm text-slate-600
                 hover:bg-slate-100 hover:text-slate-900
                 transition-all duration-200"
          [class.justify-center]="isMinimized"
          [class.gap-3]="!isMinimized"
          [ngClass]="{'bg-slate-900 text-white': isActiveRoute('/admin/orders')}">

          <svg class="nav-icon w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>

          <span 
            class="transition-all duration-300 whitespace-nowrap"
            [class.opacity-0]="isMinimized"
            [class.w-0]="isMinimized"
            [class.overflow-hidden]="isMinimized">
            Game Orders
          </span>
        </a>

        <!-- DIGITAL ORDERS -->
        <a
          routerLink="/admin/digital-orders"
          title="Digital Orders"
          routerLinkActive="active"
          class="nav-item nav-item-enter group
                 flex items-center px-3 py-2.5 rounded-lg
                 font-medium text-sm text-slate-600
                 hover:bg-slate-100 hover:text-slate-900
                 transition-all duration-200"
          [class.justify-center]="isMinimized"
          [class.gap-3]="!isMinimized"
          [ngClass]="{'bg-slate-900 text-white': isActiveRoute('/admin/digital-orders')}">

          <svg class="nav-icon w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>

          <span 
            class="transition-all duration-300 whitespace-nowrap"
            [class.opacity-0]="isMinimized"
            [class.w-0]="isMinimized"
            [class.overflow-hidden]="isMinimized">
            Digital Orders
          </span>
        </a>
      </div>
    </div>

  </nav>

  <!-- ================= USER PANEL ================= -->
  <div
    *ngIf="user$ | async as user"
    class="p-3 border-t border-slate-200 relative">

    <button
      (click)="toggleDropdown()"
      class="flex items-center w-full px-3 py-2.5 rounded-lg
             hover:bg-slate-100
             transition-all duration-200
             group"
      [class.justify-center]="isMinimized">

      <!-- AVATAR -->
      <div
        class="relative w-9 h-9 rounded-lg
               bg-slate-900
               flex items-center justify-center
               text-white font-semibold text-sm
               transition-all duration-200
               group-hover:scale-105
               flex-shrink-0">
        {{ (user.username || user.email || 'U')[0] | uppercase }}
        
        <!-- Online indicator -->
        <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-white"></div>
      </div>

      <!-- USER INFO -->
      <div class="ml-3 flex-1 text-left transition-all duration-300 min-w-0" 
           [class.hidden]="isMinimized"
           [class.opacity-0]="isMinimized"
           [class.w-0]="isMinimized">
        <div class="font-semibold text-sm text-slate-900 truncate leading-tight">
          {{ user.username }}
        </div>
        <div class="text-xs text-slate-500 truncate mt-0.5">
          Admin
        </div>
      </div>

      <!-- CHEVRON -->
      <svg *ngIf="!isMinimized"
           class="w-4 h-4 text-slate-400 transition-transform duration-200 flex-shrink-0"
           [class.rotate-180]="isDropdownOpen"
           fill="none" 
           stroke="currentColor" 
           viewBox="0 0 24 24"
           stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- DROPDOWN MENU -->
    <div
      *ngIf="isDropdownOpen && !isMinimized"
      class="dropdown-enter
             absolute left-3 right-3 bottom-16
             rounded-lg 
             bg-white
             border border-slate-200
             shadow-xl 
             overflow-hidden
             divide-y divide-slate-100">

      <a 
        routerLink="/profile" 
        (click)="closeDropdown()"
        class="flex items-center gap-3 px-4 py-3 text-sm font-medium
               text-slate-700 
               hover:bg-slate-50
               transition-colors duration-150">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span>Profile</span>
      </a>

      <a 
        routerLink="/settings/password"
        (click)="closeDropdown()"
        class="flex items-center gap-3 px-4 py-3 text-sm font-medium
               text-slate-700 
               hover:bg-slate-50
               transition-colors duration-150">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
        <span>Change Password</span>
      </a>

      <button 
        (click)="logout()"
        class="flex items-center gap-3 w-full px-4 py-3 text-sm font-medium
               text-slate-700 
               hover:bg-red-50 hover:text-red-600
               transition-colors duration-150">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</aside>

<!-- MOBILE BACKDROP -->
<div
  *ngIf="!isMinimized"
  class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-30 lg:hidden
         transition-opacity duration-300 cursor-pointer"
  (click)="toggleSidebar()">
</div>
