<style>
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(-10px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes scaleIn {
    from {
      opacity: 0;
      transform: scale(0.95);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes pulse {
    0%, 100% {
      opacity: 1;
    }
    50% {
      opacity: 0.6;
    }
  }

  .nav-item {
    position: relative;
    overflow: hidden;
  }

  .nav-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: linear-gradient(to bottom, #8b5cf6, #6366f1);
    border-radius: 0 2px 2px 0;
    transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-item.active::before {
    height: 60%;
  }

  .nav-item-enter {
    animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .dropdown-enter {
    animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .badge-pulse {
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .sidebar-backdrop {
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }

  /* Hover glow effect */
  .nav-item:hover .nav-icon {
    filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.3));
  }

  /* Smooth icon transitions */
  .nav-icon {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-item:hover .nav-icon {
    transform: translateY(-1px);
  }

  /* Active state glow */
  .nav-item.active .nav-icon {
    filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.4));
  }

  /* Logo container hover effect for minimized state */
  .logo-container {
    position: relative;
  }

  .logo-content {
    transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .toggle-reveal {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .logo-container.minimized:hover .logo-content {
    opacity: 0;
    transform: scale(0.9);
  }

  .logo-container.minimized:hover .toggle-reveal {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
</style>

<aside
  class="fixed left-0 top-0 h-full z-40
         sidebar-backdrop bg-white/80
         border-r border-gray-200/50 shadow-2xl
         flex flex-col
         transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
  [class.w-72]="!isMinimized"
  [class.w-20]="isMinimized">

  <!-- ================= HEADER ================= -->
  <div
    class="flex items-center h-20 border-b border-gray-200/50
           transition-all duration-300"
    [class.justify-center]="isMinimized"
    [class.px-5]="!isMinimized"
    [class.px-3]="isMinimized">

    <!-- LOGO CONTAINER - WITH HOVER TOGGLE FOR MINIMIZED STATE -->
      <div 
        class="logo-container flex items-center transition-all duration-300"
        [class.minimized]="isMinimized"
      [class.w-full]="isMinimized"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized">
      
      <!-- NORMAL LOGO CONTENT -->
      <div class="logo-content flex items-center"
           [class.gap-3]="!isMinimized">
        
        <!-- LOGO CIRCLE -->
        <div
          class="relative w-11 h-11 
                 border border-purple-300
                 rounded-2xl
                 flex items-center justify-center 
                 shadow-lg shadow-purple-500/30
                 transition-all duration-300 hover:shadow-xl hover:shadow-purple-200/40
                 hover:scale-105 flex-shrink-0 cursor-pointer">
          <svg 
            class="w-6 h-6 text-purple-500"
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 12h2m4-4v2m0 4v2m4-4h2M7 17l2-2h6l2 2M5 7h14a2 2 0 0 1 2 2v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V9a2 2 0 0 1 2-2z"/>
          </svg>
          
          <!-- Glow effect -->
          <div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-purple-400 to-indigo-500 opacity-0 hover:opacity-10 transition-opacity duration-300"></div>
        </div>

        <!-- TITLE (ONLY WHEN EXPANDED) -->
        <div
          *ngIf="!isMinimized"
          class="flex flex-col">
          <span class="font-bold text-lg text-gray-900 leading-tight">
            Outspace
          </span>
          <span class="text-xs text-gray-500 font-medium">
            Admin Panel
          </span>
        </div>
      </div>

      <!-- TOGGLE BUTTON REVEAL (HOVER TO TOGGLE BOTH STATES) -->
      <div 
        *ngIf="isMinimized"
        class="toggle-reveal flex items-center justify-center w-full">
        <button
          (click)="toggleSidebar()"
          class="p-2.5 rounded-xl 
                 bg-gradient-to-br from-purple-500 to-indigo-600
                 hover:from-purple-600 hover:to-indigo-700
                 shadow-lg shadow-purple-500/30
                 transition-all duration-300
                 hover:scale-105 active:scale-95 cursor-pointer">

          <svg
            class="w-5 h-5 text-white"
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24">
            <path 
              stroke-width="2.5" 
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- TOGGLE BUTTON (ONLY WHEN EXPANDED) -->
    <button
      *ngIf="!isMinimized"
      (click)="toggleSidebar()"
      class="ml-auto p-2.5 rounded-xl 
             bg-gray-100/50 hover:bg-gray-200/70
             transition-all duration-300
             hover:scale-105 active:scale-95 cursor-pointer">

      <svg
        class="w-5 h-5 text-gray-600"
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24">
        <path 
          stroke-width="2.5" 
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
  </div>

  <!-- ================= NAVIGATION ================= -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-4 space-y-1
              scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-transparent">

    <!-- DASHBOARD -->
    <a
      routerLink="/dashboard"
      title="Dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item nav-item-enter group
             flex items-center px-3.5 py-3 rounded-xl
             font-medium text-gray-600
             hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
             hover:text-purple-700
             transition-all duration-300"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized"
      [ngClass]="{'bg-gradient-to-r from-purple-50 to-indigo-50 text-purple-700': isActiveRoute('/dashboard')}">

      <svg class="nav-icon w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <span 
        class="transition-all duration-300 text-sm whitespace-nowrap"
        [class.opacity-0]="isMinimized"
        [class.w-0]="isMinimized"
        [class.overflow-hidden]="isMinimized">
        Dashboard
      </span>
    </a>

    <!-- CONVERSATIONS -->
    <a
      routerLink="/admin/conversations"
      title="Conversations"
      routerLinkActive="active"
      class="nav-item nav-item-enter group
             relative flex items-center px-3.5 py-3 rounded-xl
             font-medium text-gray-600
             hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
             hover:text-purple-700
             transition-all duration-300"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized"
      [ngClass]="{'bg-gradient-to-r from-purple-50 to-indigo-50 text-purple-700': isActiveRoute('/admin/conversations')}">

      <svg class="nav-icon w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>

      <span 
        class="transition-all duration-300 text-sm whitespace-nowrap"
        [class.opacity-0]="isMinimized"
        [class.w-0]="isMinimized"
        [class.overflow-hidden]="isMinimized">
        Conversations
      </span>

      <!-- UNREAD BADGE -->
      <span
        *ngIf="unreadCount > 0"
        class="badge-pulse
               absolute top-2 
               min-w-[20px] h-5 px-1.5
               rounded-full 
               bg-gradient-to-br from-red-500 to-pink-500
               text-white
               text-[11px] font-bold
               flex items-center justify-center
               shadow-lg shadow-red-500/50
               transition-all duration-300"
        [class.right-2]="!isMinimized"
        [class.right-1]="isMinimized"
        [class.scale-90]="isMinimized">
        {{ unreadCount > 99 ? '99+' : unreadCount }}
      </span>
    </a>

    <!-- GAMES -->
    <a
      routerLink="/videogames"
      title="Video Games"
      routerLinkActive="active"
      class="nav-item nav-item-enter group
             flex items-center px-3.5 py-3 rounded-xl
             font-medium text-gray-600
             hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
             hover:text-purple-700
             transition-all duration-300"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized"
      [ngClass]="{'bg-gradient-to-r from-purple-50 to-indigo-50 text-purple-700': isActiveRoute('/videogames')}">

      <svg class="nav-icon w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>

      <span 
        class="transition-all duration-300 text-sm whitespace-nowrap"
        [class.opacity-0]="isMinimized"
        [class.w-0]="isMinimized"
        [class.overflow-hidden]="isMinimized">
        Games
      </span>
    </a>

    <!-- ADD GAME 
    <a
      routerLink="/videogames/new"
      routerLinkActive="active"
      class="nav-item nav-item-enter group
             flex items-center px-3.5 py-3 rounded-xl
             font-medium text-gray-600
             hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
             hover:text-purple-700
             transition-all duration-300"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized"
      [ngClass]="{'bg-gradient-to-r from-purple-50 to-indigo-50 text-purple-700': isActiveRoute('/videogames/new')}">

      <svg class="nav-icon w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>

      <span 
        class="transition-all duration-300 text-sm whitespace-nowrap"
        [class.opacity-0]="isMinimized"
        [class.w-0]="isMinimized"
        [class.overflow-hidden]="isMinimized">
        Add Game
      </span>
    </a>
    -->

    <!-- ORDERS -->
    <a
      routerLink="/admin/orders"
      title="Order"
      routerLinkActive="active"
      class="nav-item nav-item-enter group
             flex items-center px-3.5 py-3 rounded-xl
             font-medium text-gray-600
             hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
             hover:text-purple-700
             transition-all duration-300"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized"
      [ngClass]="{'bg-gradient-to-r from-purple-50 to-indigo-50 text-purple-700': isActiveRoute('/admin/orders')}">

      <svg class="nav-icon w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
      </svg>

      <span 
        class="transition-all duration-300 text-sm whitespace-nowrap"
        [class.opacity-0]="isMinimized"
        [class.w-0]="isMinimized"
        [class.overflow-hidden]="isMinimized">
        Orders
      </span>
    </a>

    <!-- DIGITAL PRODUCTS -->
    <a
      routerLink="/admin/digital-products"
      title="Digital Products"
      routerLinkActive="active"
      class="nav-item nav-item-enter group
             flex items-center px-3.5 py-3 rounded-xl
             font-medium text-gray-600
             hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
             hover:text-purple-700
             transition-all duration-300"
      [class.justify-center]="isMinimized"
      [class.gap-3]="!isMinimized"
      [ngClass]="{'bg-gradient-to-r from-purple-50 to-indigo-50 text-purple-700': isActiveRoute('/admin/digital-products')}">

      <svg class="nav-icon w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
      </svg>

      <span 
        class="transition-all duration-300 text-sm whitespace-nowrap"
        [class.opacity-0]="isMinimized"
        [class.w-0]="isMinimized"
        [class.overflow-hidden]="isMinimized">
        Digital Products
      </span>
    </a>

    <!-- DIVIDER -->
    <div class="py-2" [class.hidden]="isMinimized">
      <div class="h-px bg-gradient-to-r from-transparent via-gray-200 to-transparent"></div>
    </div>

  </nav>

  <!-- ================= USER PANEL ================= -->
  <div
    *ngIf="user$ | async as user"
    class="p-3 border-t border-gray-200/50 relative">

    <button
      (click)="toggleDropdown()"
      class="flex items-center w-full px-3 py-3 rounded-xl
             hover:bg-gradient-to-r hover:from-gray-50 hover:to-gray-100
             transition-all duration-300
             group"
      [class.justify-center]="isMinimized">

      <!-- AVATAR -->
      <div
        class="relative w-10 h-10 rounded-xl
               border border-purple-200
               flex items-center justify-center
               text-gray-600 font-bold text-sm
               shadow-lg shadow-purple-500/30
               transition-all duration-300
               group-hover:shadow-xl group-hover:shadow-purple-500/40
               group-hover:scale-105 flex-shrink-0">
        {{ (user.username || user.email || 'U')[0] | uppercase }}
        
        <!-- Online indicator -->
        <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></div>
      </div>

      <!-- USER INFO -->
      <div class="ml-3 flex-1 text-left transition-all duration-300 min-w-0" 
           [class.hidden]="isMinimized"
           [class.opacity-0]="isMinimized"
           [class.w-0]="isMinimized">
        <div class="font-semibold text-sm text-gray-900 truncate leading-tight">
          {{ user.username }}
        </div>
        <div class="text-xs text-gray-500 truncate mt-0.5">
          {{ user.email }}
        </div>
      </div>

      <!-- CHEVRON -->
      <svg *ngIf="!isMinimized"
           class="w-4 h-4 text-gray-400 transition-all duration-300 flex-shrink-0"
           [class.rotate-180]="isDropdownOpen"
           fill="none" 
           stroke="currentColor" 
           viewBox="0 0 24 24">
        <path stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- DROPDOWN MENU -->
    <div
      *ngIf="isDropdownOpen && !isMinimized"
      class="dropdown-enter
             absolute left-3 right-3 bottom-20
             rounded-xl 
             bg-white/90 backdrop-blur-xl
             border border-gray-200/50 
             shadow-2xl 
             overflow-hidden
             divide-y divide-gray-100">

      <a 
        routerLink="/profile" 
        (click)="closeDropdown()"
        class="flex items-center gap-3 px-4 py-3 text-sm font-medium
               text-gray-700 
               hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
               hover:text-purple-700
               transition-all duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        Profile
      </a>

      <a 
        routerLink="/settings/password"
        (click)="closeDropdown()"
        class="flex items-center gap-3 px-4 py-3 text-sm font-medium
               text-gray-700 
               hover:bg-gradient-to-r hover:from-purple-50 hover:to-indigo-50
               hover:text-purple-700
               transition-all duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
        Change Password
      </a>

      <button 
        (click)="logout()"
        class="flex items-center gap-3 w-full px-4 py-3 text-sm font-medium
               text-red-600 
               hover:bg-red-50
               transition-all duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Logout
      </button>
    </div>
  </div>
</aside>

<!-- MOBILE BACKDROP -->
<div
  *ngIf="!isMinimized"
  class="fixed inset-0 bg-black/20 backdrop-blur-sm z-30 lg:hidden
         transition-opacity duration-300 cursor-pointer"
  (click)="toggleSidebar()">
</div>
