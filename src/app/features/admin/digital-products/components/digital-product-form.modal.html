<style>
  @keyframes modalFadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes modalSlideIn {
    from {
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes modalFadeOut {
    from {
      opacity: 1;
    }
    to {
      opacity: 0;
    }
  }

  @keyframes modalSlideOut {
    from {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    to {
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
    }
  }

  .modal-overlay {
    animation: modalFadeIn 0.2s ease-out;
  }

  .modal-overlay.closing {
    animation: modalFadeOut 0.2s ease-out;
  }

  .modal-content {
    animation: modalSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-content.closing {
    animation: modalSlideOut 0.2s ease-out;
  }
</style>

<!-- OVERLAY -->
<div 
  class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 px-4"
  [class.closing]="isClosing"
  (click)="onOverlayClick($event)">

  <!-- MODAL -->
  <div 
    class="modal-content bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden"
    [class.closing]="isClosing"
    (click)="$event.stopPropagation()">

    <!-- HEADER -->
    <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-6 py-5 border-b border-gray-300">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold text-gray-800">
          {{ product ? 'Edit Digital Product' : 'Add New Digital Product' }}
        </h2>

        <button
          (click)="close()"
          class="text-black/70 hover:text-black cursor-pointer transition-colors p-1 hover:bg-white/10 rounded-lg"
          type="button"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- FORM CONTENT -->
    <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

        <!-- IMAGE UPLOAD -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Product Image
          </label>
          <div class="flex gap-4 items-start">
            <!-- Image Preview -->
            <div class="relative w-32 h-32 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center overflow-hidden bg-gray-50 hover:border-gray-400 transition group">
              <img
                *ngIf="imagePreview"
                [src]="imagePreview"
                class="w-full h-full object-cover"
                alt="Product preview"
              />
              <div *ngIf="!imagePreview" class="text-center p-2">
                <svg class="w-10 h-10 mx-auto text-gray-400 group-hover:text-gray-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="text-xs text-gray-500 mt-1 block">No image</span>
              </div>
            </div>

            <!-- Upload Button -->
            <div class="flex-1">
              <label class="inline-flex items-center gap-2 px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                Choose Image
                <input type="file" (change)="onImageSelected($event)" class="hidden" accept="image/*" />
              </label>
              <p class="text-xs text-gray-500 mt-2">
                Recommended: Square image, at least 400x400px
              </p>
            </div>
          </div>
        </div>

        <!-- NAME -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Product Name <span class="text-red-500">*</span>
          </label>
          <input
            formControlName="name"
            placeholder="e.g., Microsoft Office 365, Adobe Photoshop"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            [class.border-red-300]="form.get('name')?.invalid && form.get('name')?.touched"
          />
          <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" 
             class="text-xs text-red-600 mt-1">
            Product name is required
          </p>
        </div>

        <!-- BRAND / PLATFORM -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Brand
            </label>
            <input
              formControlName="brand"
              placeholder="e.g., Microsoft, Adobe"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Platform
            </label>
            <input
              formControlName="platform"
              placeholder="e.g., Windows, Mac, Web"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>
        </div>

        <!-- TYPE / LICENSE -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Product Type <span class="text-red-500">*</span>
            </label>
            <select 
              formControlName="productType" 
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
              <option *ngFor="let t of productTypeOptions" [value]="t.value">
                {{ t.label }}
              </option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              License Duration <span class="text-red-500">*</span>
            </label>
            <select 
              formControlName="licenseDuration" 
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
              <option *ngFor="let l of licenseDurationOptions" [value]="l.value">
                {{ l.label }}
              </option>
            </select>
          </div>
        </div>

        <!-- PRICE -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Price (₱) <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">₱</span>
            <input
              type="number"
              formControlName="price"
              placeholder="0.00"
              step="0.01"
              min="0"
              class="w-full border border-gray-300 rounded-lg pl-8 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              [class.border-red-300]="form.get('price')?.invalid && form.get('price')?.touched"
            />
          </div>
          <p *ngIf="form.get('price')?.invalid && form.get('price')?.touched" 
             class="text-xs text-red-600 mt-1">
            Price must be greater than 0
          </p>
        </div>

        <!-- DESCRIPTION -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Description
          </label>
          <textarea
            formControlName="description"
            placeholder="Provide details about this product, features, requirements, etc."
            rows="4"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none"
          ></textarea>
        </div>

        <!-- ACTIVE (EDIT ONLY) -->
        <div *ngIf="product" class="flex items-center gap-3 p-4 bg-gray-50 rounded-lg">
          <input 
            type="checkbox" 
            id="isActive"
            formControlName="isActive"
            class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-2 focus:ring-blue-500 cursor-pointer"
          />
          <label for="isActive" class="text-sm font-medium text-gray-700 cursor-pointer select-none">
            Product is active and available for purchase
          </label>
        </div>

        <div *ngIf="submitError"
             class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
          {{ submitError }}
        </div>

      </form>
    </div>

    <!-- FOOTER ACTIONS -->
    <div class="bg-gray-50 px-6 py-4 border-t border-gray-200">
      <div class="flex items-center justify-end gap-3">
        <button
          type="button"
          (click)="close()"
          class="px-5 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition"
        >
          Cancel
        </button>

        <button
          type="submit"
          (click)="submit()"
          [disabled]="loading || form.invalid"
          class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-lg text-sm font-medium hover:from-blue-700 hover:to-blue-800 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-sm hover:shadow flex items-center gap-2"
        >
          <svg *ngIf="loading" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ loading ? 'Saving...' : (product ? 'Update Product' : 'Create Product') }}</span>
        </button>
      </div>
    </div>

  </div>
</div>
