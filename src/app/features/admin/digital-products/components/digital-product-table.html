<div class="overflow-x-auto bg-white border rounded">
  <table class="min-w-full text-sm">
    <thead class="bg-gray-100 text-left">
      <tr>
        <th class="p-3">Image</th>
        <th class="p-3">Name</th>
        <th class="p-3">Type</th>
        <th class="p-3">License</th>
        <th class="p-3">Price</th>
        <th class="p-3">Stock</th>
        <th class="p-3">Available</th>
        <th class="p-3">Status</th>
        <th class="p-3 text-right">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let product of products"
        class="border-t hover:bg-gray-50"
      >
        <!-- IMAGE PREVIEW -->
        <td class="p-3">
          <img
            *ngIf="getImageUrl(product) as imageUrl"
            [src]="imageUrl"
            class="w-12 h-12 object-cover rounded border"
            alt="Product image"
          />
          <div
            *ngIf="!getImageUrl(product)"
            class="w-12 h-12 bg-gray-200 rounded flex items-center justify-center text-xs text-gray-500"
          >
            No image
          </div>
        </td>

        <!-- NAME -->
        <td class="p-3 font-medium">
          {{ product.name }}
        </td>

        <!-- TYPE -->
        <td class="p-3">
          {{ getProductTypeLabel(product) }}
        </td>

        <!-- LICENSE -->
        <td class="p-3">
          {{ getLicenseDurationLabel(product) }}
        </td>

        <!-- PRICE -->
        <td class="p-3">
          ₱{{ product.price | number:'1.2-2' }}
        </td>

        <!-- STOCK -->
        <td class="p-3">
          {{ product.stock }}
        </td>

        <!-- AVAILABLE -->
        <td class="p-3">
          {{ product.availableKeys }}
        </td>

        <!-- STATUS -->
        <td class="p-3">
          <span
            class="px-2 py-1 text-xs rounded"
            [ngClass]="product.isActive
              ? 'bg-green-100 text-green-800'
              : 'bg-red-100 text-red-800'"
          >
            {{ product.isActive ? 'Active' : 'Archived' }}
          </span>
        </td>

        <!-- ACTIONS -->
        <td class="p-3 text-right space-x-2">
          <button
            class="px-2 py-1 text-blue-600 hover:underline"
            (click)="edit.emit(product)"
          >
            Edit
          </button>

          <button
            *ngIf="product.isActive"
            class="px-2 py-1 text-red-600 hover:underline"
            (click)="archive.emit(product)"
          >
            Archive
          </button>

          <button
            *ngIf="!product.isActive"
            class="px-2 py-1 text-green-600 hover:underline"
            (click)="restore.emit(product)"
          >
            Restore
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
