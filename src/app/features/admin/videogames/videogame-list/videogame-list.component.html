<style>
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-fade {
    animation: fade 0.25s ease-out;
  }
</style>

<!-- ================= MAIN WRAPPER ================= -->
<div class="max-w-7xl mx-auto px-8 pb-12"
     *ngIf="filteredGames$ | async as games; else skeletonLoading">

  <!-- ================= HEADER ================= -->
  <div class="flex justify-between items-center mb-6 animate-fade">

    <h2 class="text-2xl font-semibold text-gray-900">
      Video Games
    </h2>

    <div class="flex items-center gap-3">

      <input
        type="text"
        [value]="searchTerm$.value"
        (input)="searchTerm$.next($event.target.value)"
        placeholder="Search by title or platform"
        class="px-4 py-2 w-60 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

      <button
        routerLink="/videogames/new"
        class="rounded-full bg-black text-white px-5 py-2.5 text-sm font-medium hover:bg-gray-800 transition cursor-pointer">
        + Add Game
      </button>

        <div class="flex items-center gap-2">

          <!-- TABLE VIEW -->
          <button
            (click)="toggleView('table')"
            class="group flex items-center justify-center
                  w-10 h-10 rounded-xl border transition
                  hover:bg-gray-900 hover:border-gray-300
                  focus:outline-none focus:ring-4 focus:ring-purple-500/20 cursor-pointer"
            [ngClass]="viewMode === 'table'
              ? 'bg-gray-900 text-white border-gray-900'
              : 'bg-white text-gray-500 border-gray-200'"
            title="Table view"
          >
            <svg
              class="w-5 h-5 transition-transform group-hover:scale-110"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 6h18M3 12h18M3 18h18M6 6v12M12 6v12M18 6v12" />
            </svg>
          </button>

          <!-- CARD VIEW -->
          <button
            (click)="toggleView('card')"
            class="group flex items-center justify-center
                  w-10 h-10 rounded-xl border transition
                  hover:bg-gray-100 hover:border-gray-300
                  focus:outline-none focus:ring-4 focus:ring-purple-500/20 cursor-pointer"
            [ngClass]="viewMode === 'card'
              ? 'bg-gray-900 text-white border-gray-900'
              : 'bg-white text-gray-500 border-gray-200'"
            title="Card view"
          >
            <svg
              class="w-5 h-5 transition-transform group-hover:scale-110"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
          </button>

        </div>


    </div>
  </div>


  <!-- ================= TABLE VIEW ================= -->
  <div *ngIf="viewMode === 'table'"
       class="animate-fade bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">

    <table class="w-full text-sm text-gray-700">
      <thead class="bg-gray-50 text-xs uppercase text-gray-500">
        <tr>
          <th class="px-6 py-4">#</th>
          <th class="px-6 py-4 text-left">Title</th>
          <th class="px-6 py-4 text-left">Price</th>
          <th class="px-6 py-4 text-left">Platform</th>
          <th class="px-6 py-4 text-right">Actions</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let game of games; let i = index"
            class="hover:bg-gray-50">

          <td class="px-6 py-4 text-gray-400">{{ i + 1 }}</td>

          <td class="px-6 py-4 font-medium text-gray-900 flex items-center gap-3">
            <img *ngIf="game.imageUrl" [src]="game.imageUrl" class="h-10 w-10 rounded object-cover" />
            {{ game.title }}
          </td>

          <td class="px-6 py-4">
            ₱{{ game.price | number:'1.2-2' }}
          </td>

          <td class="px-6 py-4">{{ game.platform }}</td>

          <td class="px-6 py-4 text-right">
            <div class="inline-flex gap-3">
              <button (click)="editGame(game.id)" class="text-gray-400 hover:text-black cursor-pointer">✏️</button>
              <button (click)="confirmDelete(game.id)" class="text-gray-400 hover:text-red-600 cursor-pointer">🗑️</button>
            </div>
          </td>

        </tr>
      </tbody>
    </table>

    <div *ngIf="!games.length" class="py-16 text-center text-gray-500">
      No video games found.
    </div>

  </div>


    <!-- ================= COMPACT CARD VIEW ================= -->
    <div *ngIf="viewMode === 'card'"
        class="animate-fade grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

      <div *ngFor="let game of games"
          class="group rounded-xl border border-gray-200 bg-white
                  hover:border-gray-300 hover:shadow-sm
                  transition overflow-hidden cursor-pointer">

        <!-- IMAGE -->
        <div class="relative h-36 bg-gray-100 overflow-hidden">
          <img
            *ngIf="game.imageUrl"
            [src]="game.imageUrl"
            class="w-full h-full object-cover
                  transition-transform duration-300
                  group-hover:scale-105"
          />

          <!-- subtle bottom fade -->
          <div class="absolute inset-x-0 bottom-0 h-16
                      bg-gradient-to-t from-black/30 to-transparent">
          </div>
        </div>

        <!-- CONTENT -->
        <div class="px-4 py-3 space-y-1">

          <p class="text-[11px] uppercase tracking-wide text-gray-500">
            {{ game.platform }}
          </p>

          <h3 class="text-sm font-semibold leading-tight text-gray-900 line-clamp-1">
            {{ game.title }}
          </h3>

          <div class="flex items-center justify-between pt-2">

            <span class="text-sm font-semibold text-gray-900">
              ₱{{ game.price | number:'1.2-2' }}
            </span>

            <!-- ACTIONS -->
            <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition">

              <button
                (click)="editGame(game.id)"
                class="text-xs px-2 py-1 rounded-md
                      border border-gray-200
                      hover:bg-gray-100 transition cursor-pointer">
                Edit
              </button>

              <button
                (click)="confirmDelete(game.id)"
                class="text-xs px-2 py-1 rounded-md
                      border border-red-200 text-red-600
                      hover:bg-red-50 transition cursor-pointer">
                Delete
              </button>

            </div>

          </div>
        </div>

      </div>

    </div>


</div>



<!-- ================= SKELETON LOADING TEMPLATE ================= -->
<ng-template #skeletonLoading>

  <!-- HEADER SKELETON -->
  <div class="max-w-7xl mx-auto px-8 pb-12">

    <div class="flex justify-between items-center mb-6">

      <app-skeleton-box width="200px" height="30px"></app-skeleton-box>

      <div class="flex items-center gap-3">
        <app-skeleton-box width="250px" height="35px"></app-skeleton-box>
        <app-skeleton-box width="90px" height="35px" rounded="20px"></app-skeleton-box>
        <app-skeleton-box width="40px" height="35px" rounded="10px"></app-skeleton-box>
        <app-skeleton-box width="40px" height="35px" rounded="10px"></app-skeleton-box>
      </div>

    </div>

    <!-- TABLE SKELETON -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">

      <div class="p-6 space-y-4">

        <div *ngFor="let i of [1,2,3,4,5]">
          <div class="grid grid-cols-5 gap-6 items-center">

            <app-skeleton-box width="40px" height="20px"></app-skeleton-box>
            <app-skeleton-box width="120px" height="20px"></app-skeleton-box>
            <app-skeleton-box width="80px" height="20px"></app-skeleton-box>
            <app-skeleton-box width="100px" height="20px"></app-skeleton-box>
            <app-skeleton-box width="80px" height="20px"></app-skeleton-box>

          </div>
        </div>

      </div>

    </div>

  </div>

</ng-template>
