<style>
  @layer utilities {
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(20px) scale(0.95); }
    }

    .toast-enter { animation: toast-in 0.3s ease-out forwards; }
    .toast-leave { animation: toast-out 0.3s ease-in forwards; }
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fade-slow {
    animation: fade 0.3s ease-out;
  }

  /* Staggered animation for product cards */
  .product-card {
    opacity: 0;
    animation: fadeInUp 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }

  /* Stagger delay for each row of 3 items */
  .product-card:nth-child(3n+1) { animation-delay: 0.15s; }
  .product-card:nth-child(3n+2) { animation-delay: 0.3s; }
  .product-card:nth-child(3n+3) { animation-delay: 0.45s; }
  .product-card:nth-child(n+4) { animation-delay: 0.55s; }
  .product-card:nth-child(n+7) { animation-delay: 0.65s; }
  .product-card:nth-child(n+10) { animation-delay: 0.75s; }

  .filter-panel {
    max-height: 0;
    opacity: 0;
    transform: translateY(-4px);
    overflow: hidden;
    pointer-events: none;
    transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.25s ease;
  }

  .filter-panel.open {
    max-height: 280px;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dark-games {
    background-color: #0b0b0f;
    color: #f3f4f6;
  }

  .dark-games input,
  .dark-games select {
    background-color: #111118;
    color: #f3f4f6;
    border-color: #2a2a35;
  }

  .dark-games input::placeholder {
    color: #9aa0b5;
  }

  .dark-games .filter-trigger {
    background-color: #111118;
    border-color: #2a2a35;
  }

  .dark-games .filter-trigger-label {
    color: #f3f4f6;
  }

  .dark-games .filter-panel {
    background-color: rgba(17, 17, 24, 0.95);
    border-color: #2a2a35;
  }

  .dark-games .meta-text,
  .dark-games .price-text,
  .dark-games .label-text,
  .dark-games .cta-text {
    color: #cbd5f5;
  }

  .dark-games .cta-text:hover {
    color: #f8fafc;
  }

  .dark-games .card-image {
    background-color: #141422;
  }

  .dark-games .toast {
    background-color: #101018;
    border-color: #2a2a35;
  }

  /* Pagination styles */
  .pagination-button {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .pagination-button:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  .pagination-button:active:not(:disabled) {
    transform: translateY(0);
  }

  .pagination-button.active {
    transform: scale(1.1);
  }
</style>

<!-- SKELETON LOADING  -->
<ng-template #loadingSkeleton>
  <div class="max-w-7xl mx-auto px-4 py-10 mt-10">

    <div class="flex justify-between mb-12">
      <app-skeleton-box width="200px" height="40px"></app-skeleton-box>
      <app-skeleton-box width="300px" height="45px" rounded="30px"></app-skeleton-box>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-14">

      <div *ngFor="let x of [1,2,3,4,5,6,7,8,9]">

        <app-skeleton-box width="100%" height="320px" rounded="0"></app-skeleton-box>

        <div class="mt-4 space-y-2">
          <app-skeleton-box width="40%" height="12px"></app-skeleton-box>
          <app-skeleton-box width="90%" height="16px"></app-skeleton-box>
          <app-skeleton-box width="50%" height="16px"></app-skeleton-box>
        </div>

      </div>

    </div>

  </div>
</ng-template>

<!--  MAIN WRAPPER -->
<div *ngIf="filteredGames$ | async as games; else loadingSkeleton"
     class="mt-10 max-w-7xl mx-auto px-4 py-10 font-sans bg-white text-gray-900 flex flex-row"
     [ngClass]="{ 'dark-games': isDarkMode }">

     <div class="w-full">
        <!--  HEADER  -->
        <div class="flex flex-col gap-4 sm:gap-5 mb-6 animate-fade-slow">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4">
            <h1 class="text-4xl font-semibold tracking-tight">
              Games Store
            </h1>
            
            <!-- Results count -->
            <div class="text-sm text-gray-500">
              Showing {{ getStartIndex() + 1 }}-{{ getEndIndex() }} of {{ games.length }} games
            </div>
          </div>
        </div>

            <div class="flex flex-col sm:flex-row items-start gap-3 w-full mb-8 animate-fade-slow">
        <input
          type="search"
          placeholder="Search games..."
          class="rounded-full px-5 py-3 w-full md:w-80 border border-gray-300
                focus:ring-2 focus:ring-black/10 transition outline-none"
          (input)="onSearchChange($event)"
        />

        <div class="flex items-center gap-3 w-full sm:w-auto">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap">Show:</label>
            <select
              [(ngModel)]="itemsPerPage"
              (change)="onItemsPerPageChange()"
              class="px-3 py-2 border border-gray-300 rounded-lg text-sm
                     focus:outline-none focus:ring-2 focus:ring-black/10 transition"
            >
              <option [value]="9">9</option>
              <option [value]="18">18</option>
              <option [value]="36">36</option>
              <option [value]="72">72</option>
            </select>
          </div>

          <div class="flex-1 sm:flex-initial sm:w-60 relative">
            <button
              type="button"
              class="filter-trigger w-full rounded-full px-5 py-3 text-sm font-medium
                    flex items-center justify-between gap-3
                    bg-white border border-gray-300
                    hover:border-gray-400 transition
                    focus:outline-none focus:ring-2 focus:ring-black/10"
              [attr.aria-expanded]="filtersOpen"
              (click)="toggleFilters()"
            >
              <span class="filter-trigger-label text-gray-900">Filters</span>
              <svg
                class="w-4 h-4 text-gray-500 transition-transform duration-300"
                [ngClass]="{ 'rotate-180': filtersOpen }"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.53a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
            
            <div
              class="filter-panel
                    relative sm:absolute
                    sm:left-0 sm:top-full
                    mt-2 w-full z-30
                    rounded-2xl
                    bg-white/95 backdrop-blur-xl
                    border border-gray-200
                    shadow-[0_20px_40px_rgba(0,0,0,0.12)]
                    px-5 py-5"
              [ngClass]="{ 'open': filtersOpen }"
            >
              <div class="space-y-5">
                <div>
                  <p class="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-2">
                    Platform
                  </p>
                  <div class="relative">
                    <select
                      class="w-full appearance-none rounded-xl
                            border border-gray-200
                            bg-gray-50 px-4 py-3 pr-10
                            text-sm text-gray-900
                            shadow-sm transition
                            focus:outline-none
                            focus:border-gray-400
                            focus:ring-2 focus:ring-black/10"
                      (change)="setPlatform($any($event.target).value)"
                      [value]="(filters$ | async)?.platform"
                    >
                      <option value="all">All platforms</option>
                      <option *ngFor="let platform of platforms$ | async" [value]="platform">
                        {{ platform }}
                      </option>
                    </select>

                    <svg
                      class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                      viewBox="0 0 20 20"
                      fill="currentColor"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.53a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </div>
                </div>

                <div>
                  <p class="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-2">
                    Price
                  </p>
                  <div class="relative">
                    <select
                      class="w-full appearance-none rounded-xl
                            border border-gray-200
                            bg-gray-50 px-4 py-3 pr-10
                            text-sm text-gray-900
                            shadow-sm transition
                            focus:outline-none
                            focus:border-gray-400
                            focus:ring-2 focus:ring-black/10"
                      (change)="setPrice($any($event.target).value)"
                      [value]="(filters$ | async)?.price"
                    >
                      <option value="any">Any price</option>
                      <option value="under-500">Under ₱500</option>
                      <option value="500-1000">₱500 – ₱1,000</option>
                      <option value="over-1000">Over ₱1,000</option>
                    </select>

                    <svg
                      class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                      viewBox="0 0 20 20"
                      fill="currentColor"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.53a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- ================= PRODUCT GRID ================= -->
      <section class="max-w-7xl mx-auto px-6 py-16">

        <!-- Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-14">

          <div
            *ngFor="let game of paginatedGames"
            [routerLink]="['/games', game.id, 'reviews']"
            class="product-card group cursor-pointer"
          >

            <!-- IMAGE -->
            <div class="aspect-square bg-gray-100 overflow-hidden">
              <img
                *ngIf="game.imageUrl"
                [src]="game.imageUrl"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
              />
            </div>

            <!-- CONTENT -->
            <div class="mt-4 space-y-1">

              <!-- JUST IN -->
              <p class="text-xs font-semibold text-red-600">
                Just In
              </p>

              <!-- TITLE -->
              <h3 class="text-base font-medium text-gray-900 leading-snug line-clamp-2">
                {{ game.title }}
              </h3>

              <!-- CATEGORY -->
              <p class="text-sm text-gray-500">
                {{ game.platform }}
              </p>

              <!-- PRICE -->
              <p class="text-sm font-medium text-gray-900">
                ₱{{ game.price | number:'1.0-0' }}
              </p>

              <!-- CTA (Hover Only) -->
              <button
                (click)="$event.stopPropagation(); addToCart(game)"
                [disabled]="game.id && loadingGames.has(game.id)"
                class="mt-3 text-sm font-medium text-gray-700
                      opacity-0 group-hover:opacity-100
                      transition-opacity duration-200
                      hover:text-black disabled:opacity-50"
              >
                {{ game.id && loadingGames.has(game.id) ? 'Adding...' : 'Add to Cart →' }}
              </button>

            </div>

          </div>

        </div>

        <!-- ================= PAGINATION ================= -->
        <div *ngIf="totalPages > 1" class="mt-16 flex items-center justify-center gap-2">
          
          <!-- Previous Button -->
          <button
            (click)="goToPage(currentPage - 1)"
            [disabled]="currentPage === 1"
            class="pagination-button flex items-center gap-2 px-4 py-2 rounded-lg
                   border border-gray-300 text-gray-700 font-medium
                   hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed
                   transition-all"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            <span class="hidden sm:inline">Previous</span>
          </button>

          <!-- Page Numbers -->
          <div class="flex items-center gap-1">
            
            <!-- First page -->
            <button
              *ngIf="shouldShowFirstPage"
              (click)="goToPage(1)"
              class="pagination-button w-10 h-10 rounded-lg flex items-center justify-center
                     font-medium transition-all"
              [ngClass]="currentPage === 1 
                ? 'bg-black text-white active' 
                : 'border border-gray-300 text-gray-700 hover:bg-gray-50'"
            >
              1
            </button>

            <!-- Left ellipsis -->
            <span *ngIf="shouldShowLeftEllipsis" class="px-2 text-gray-400">...</span>

            <!-- Visible page numbers -->
            <button
              *ngFor="let page of visiblePages"
              (click)="goToPage(page)"
              class="pagination-button w-10 h-10 rounded-lg flex items-center justify-center
                     font-medium transition-all"
              [ngClass]="currentPage === page 
                ? 'bg-black text-white active' 
                : 'border border-gray-300 text-gray-700 hover:bg-gray-50'"
            >
              {{ page }}
            </button>

            <!-- Right ellipsis -->
            <span *ngIf="shouldShowRightEllipsis" class="px-2 text-gray-400">...</span>

            <!-- Last page -->
            <button
              *ngIf="shouldShowLastPage"
              (click)="goToPage(totalPages)"
              class="pagination-button w-10 h-10 rounded-lg flex items-center justify-center
                     font-medium transition-all"
              [ngClass]="currentPage === totalPages 
                ? 'bg-black text-white active' 
                : 'border border-gray-300 text-gray-700 hover:bg-gray-50'"
            >
              {{ totalPages }}
            </button>

          </div>

          <!-- Next Button -->
          <button
            (click)="goToPage(currentPage + 1)"
            [disabled]="currentPage === totalPages"
            class="pagination-button flex items-center gap-2 px-4 py-2 rounded-lg
                   border border-gray-300 text-gray-700 font-medium
                   hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed
                   transition-all"
          >
            <span class="hidden sm:inline">Next</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>

        </div>

      </section>

     </div>

  <!-- ================= SUCCESS TOAST ================= -->
  <div
    *ngIf="showSuccessModal"
    class="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none"
  >
    <div class="bg-white shadow-xl border border-gray-200 rounded-full px-6 py-3
                backdrop-blur-xl min-w-[260px] toast"
        [ngClass]="{ 'toast-enter': !isFadingOut, 'toast-leave': isFadingOut }">

      <p class="text-gray-900 font-medium text-sm flex items-center justify-center gap-2">
        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ successMessage }}
      </p>

    </div>
  </div>
</div>
