<div class="min-h-screen py-4 mt-10 px-2 sm:px-4">
  <div class="w-full xl:max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[calc(100vh-8rem)]">

    <!-- Header -->
    <div class="p-4 border-b flex items-center gap-3 bg-gradient-to-r from-violet-500 to-indigo-500 flex-shrink-0">
      <div class="w-10 h-10 rounded-full bg-white/20 text-white flex items-center justify-center font-semibold">
        A
      </div>
      <div>
        <div class="font-medium text-white">Support Team</div>
        <div class="text-xs text-white/80">Online</div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="px-4 py-2 bg-gray-50 flex-shrink-0" *ngIf="isTyping">
      <div class="flex items-center gap-1">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-2 scrollbar-hide custom-scrollbar" #chatContainer>
      <div *ngFor="let m of messages; trackBy: trackByMessageId"
           class="flex relative group"
           [class.justify-end]="!m.isAdmin">

        <!-- Hover emoji button -->
        <button
          class="absolute -top-2 z-10"
          [class.right-2]="!m.isAdmin"
          [class.left-2]="m.isAdmin"
          (click)="toggleReactionPicker(m); $event.stopPropagation()"
          class="cursor-pointer opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-gray-600"
        >
          👻
        </button>

        <!-- Emoji picker -->
        <div *ngIf="m.showReactions"
             class="cursor-pointer absolute -top-12 flex gap-2 bg-white shadow-lg rounded-full px-3 py-2 z-20"
             [class.right-2]="!m.isAdmin"
             [class.left-2]="m.isAdmin">
          <button
            *ngFor="let emoji of reactionEmojis"
            class="cursor-pointer text-lg hover:scale-125 transition"
            (click)="reactToMessage(m, emoji)">
            {{ emoji }}
          </button>
        </div>

        <!-- Message bubble -->
        <div
          class="px-4 py-2 rounded-2xl max-w-[80%] relative cursor-pointer transition"
          [class.bg-violet-600]="!m.isAdmin"
          [class.text-white]="!m.isAdmin"
          [class.bg-white]="m.isAdmin"
          [class.rounded-tr-sm]="!m.isAdmin"
          [class.rounded-bl-sm]="m.isAdmin"
          (click)="toggleTimestamp(m)"
        >
          {{ m.message }}

          <!-- Timestamp -->
          <div
            class="absolute -bottom-6 left-0 text-xs rounded px-2 py-1 whitespace-nowrap opacity-0 transition-opacity z-10"
            [class.opacity-100]="selectedMessageId === m.id"
            [class.bg-gray-800]="!m.isAdmin"
            [class.text-white]="!m.isAdmin"
            [class.bg-gray-200]="m.isAdmin"
            [class.text-gray-800]="m.isAdmin"
          >
            {{ formatTimestamp(m.createdAt) }}
          </div>
        </div>

        <!-- Existing reaction -->
        <div *ngIf="m.reaction"
             class="absolute -bottom-3 z-10 text-sm bg-white rounded-full px-2 shadow"
             [class.right-2]="!m.isAdmin"
             [class.left-2]="m.isAdmin">
          {{ m.reaction }}
        </div>
      </div>
    </div>

    <!-- Message Input -->
    <div class="border-t p-3 flex flex-col gap-2 bg-white flex-shrink-0">
      <input
        *ngIf="isNewConversation"
        [(ngModel)]="subject"
        placeholder="Subject"
        class="border rounded-xl px-4 py-2 text-sm" />
      <div class="flex items-center gap-2">
        <input
          [(ngModel)]="newMessage"
          (keydown.enter)="send()"
          (input)="onTyping()"
          placeholder="Type a message..."
          class="flex-1 border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" />
        <button
          (click)="send()"
          class="w-10 h-10 rounded-full bg-violet-600 text-white flex items-center justify-center hover:bg-violet-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
