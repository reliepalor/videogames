<div class="min-h-screen mt-15 py-4 px-4 sm:px-0">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden h-[calc(100vh-8rem)] flex flex-col">

    <!-- Header -->
    <div class="p-4 border-b bg-gradient-to-r from-violet-500 to-indigo-500 flex-shrink-0">
      <h2 class="font-semibold text-white text-lg">Messages</h2>
      <p class="text-xs text-white/80 mt-1">
        Chat with support
      </p>
    </div>

    <!-- Conversation List -->
    <div class="flex-1 overflow-y-auto">
      <a
        [routerLink]="['/conversations', conversation?.id]"
        routerLinkActive="bg-violet-50"
        class="p-4 cursor-pointer
               border-b border-gray-100 hover:bg-gray-50
               transition flex items-center gap-4 text-decoration-none">

        <div
          class="w-12 h-12 rounded-full bg-gradient-to-br
                 from-violet-500 to-indigo-500
                 flex items-center justify-center
                 text-white font-semibold text-lg flex-shrink-0">
          A
        </div>

        <div class="flex-1 min-w-0">
          <div class="font-medium text-gray-800">
            Support Team
          </div>
          <div class="text-sm text-gray-500 truncate">
            <span *ngIf="!conversation">Click to start chatting</span>
            <span *ngIf="conversation && !conversation.id">Click to continue chatting</span>
            <span *ngIf="conversation?.id">Active conversation</span>
          </div>
        </div>

        <div *ngIf="conversation?.id" class="w-3 h-3 rounded-full bg-green-500"></div>
      </a>
    </div>

    <!-- Footer -->
    <div class="p-3 bg-gray-50 text-xs text-gray-500 text-center border-t flex-shrink-0">
      Messages are private and secure
    </div>
  </div>
</div>
